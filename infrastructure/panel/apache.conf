<Directory /var/www/html>
    AllowOverride All
    Require all granted
    Options FollowSymLinks
</Directory>

<LocationMatch "^/(?:\.github|install|installer|database|deploy|infrastructure|services|tests|backups)(?:/|$)">
    Require all denied
</LocationMatch>
<LocationMatch "^/system/secure(?:/|$)">
    Require all denied
</LocationMatch>
<FilesMatch "^(?:\.env(?:\..*)?|config(?:\.sample)?\.php|docker-compose\.yml|Dockerfile|\.dockerignore)$">
    Require all denied
</FilesMatch>

ServerTokens Prod
ServerSignature Off
