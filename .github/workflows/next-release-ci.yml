name: Next release validation

on:
  push:
    branches: [next-release, arivo-rebrand]
  pull_request:
    branches: [next-release, arivo-rebrand]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Validate shell scripts
        run: |
          bash -n installer/install.sh installer/update.sh installer/backup.sh installer/restore.sh installer/repair.sh installer/uninstall.sh
          bash -n infrastructure/panel/entrypoint.sh infrastructure/panel/run-migrations.sh infrastructure/freeradius/entrypoint.sh infrastructure/cron/worker.sh infrastructure/backup/backup.sh

      - name: Test bundled WhatsApp service
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/whatsapp/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: services/whatsapp

      - run: npm test
        working-directory: services/whatsapp

      - name: Create CI environment
        run: |
          cat > .env <<'EOF'
          COMPOSE_PROJECT_NAME=jm-panel-ci
          TZ=Asia/Dhaka
          SITE_ADDRESS=:80
          PUBLIC_HOST=127.0.0.1
          PUBLIC_ORIGIN=http://127.0.0.1
          COMPANY_NAME=JM Broadband CI
          ADMIN_USERNAME=admin
          ADMIN_FULLNAME=Administrator
          ADMIN_PASSWORD_HASH=d033e22ae348aeb5660fc2140aec35850c4da997
          DB_NAME=jm_panel
          DB_USER=jm_panel
          DB_PASSWORD=ci_database_password_32_chars
          DB_ROOT_PASSWORD=ci_root_password_32_characters
          RADIUS_SHARED_SECRET=ci_radius_secret_32_characters
          RADIUS_CLIENT_NETWORK=0.0.0.0/0
          WHATSAPP_ADMIN_API_KEY=ci_whatsapp_admin_key_32_characters
          WHATSAPP_API_KEY_PEPPER=ci_whatsapp_pepper_key_at_least_32_chars
          WHATSAPP_DELAY_MIN_MS=0
          WHATSAPP_DELAY_MAX_MS=0
          WHATSAPP_DAILY_LIMIT=10
          CRON_INTERVAL_SECONDS=5
          REMINDER_INTERVAL_SECONDS=60
          USAGE_INTERVAL_SECONDS=60
          OLT_INTERVAL_SECONDS=60
          BACKUP_DAILY_RETENTION=2
          BACKUP_WEEKLY_RETENTION=2
          BACKUP_MONTHLY_RETENTION=2
          BACKUP_INTERVAL_SECONDS=3600
          EOF

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build and start clean stack
        run: |
          if ! docker compose up -d --build; then
            docker compose ps --all
            docker compose logs --tail=200
            exit 1
          fi

      - name: Verify services
        run: |
          for attempt in $(seq 1 60); do
            expected_services="$(docker compose config --services | wc -l)"
            running_services="$(docker compose ps --services --status running | wc -l)"
            if [ "$running_services" -eq "$expected_services" ]               && curl -fsS http://127.0.0.1/ >/dev/null               && docker compose exec -T whatsapp node -e "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"               && docker compose exec -T radius freeradius -XC >/dev/null 2>&1               && docker compose exec -T panel php -r "exit(extension_loaded('curl') && extension_loaded('mbstring') ? 0 : 1);"; then
              admin_hash="$(docker compose exec -T database mariadb -N -ujm_panel -pci_database_password_32_chars jm_panel -e "SELECT password FROM tbl_users WHERE id=1 AND username='admin'")"
              company="$(docker compose exec -T database mariadb -N -ujm_panel -pci_database_password_32_chars jm_panel -e "SELECT value FROM tbl_appconfig WHERE setting='CompanyName'")"
              setup_complete="$(docker compose exec -T database mariadb -N -ujm_panel -pci_database_password_32_chars jm_panel -e "SELECT value FROM tbl_appconfig WHERE setting='setup_complete'")"
              test "$admin_hash" = "d033e22ae348aeb5660fc2140aec35850c4da997"
              test "$company" = "JM Broadband CI"
              test "$setup_complete" = "0"
              docker compose ps
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=200
          exit 1

      - name: Verify public surface hardening
        run: |
          set -euo pipefail
          for path in \
            /config.php \
            /.env \
            /install/arivo_isp_billing.sql \
            /installer/install.sh \
            /database/migrations/manifest.txt \
            /infrastructure/caddy/Caddyfile \
            /tests/release/static_release_test.js \
            /system/secure/; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1${path}")"
            test "$code" = "404"
          done
          headers="$(curl -sSI http://127.0.0.1/)"
          grep -qi '^X-Content-Type-Options: nosniff' <<<"$headers"
          grep -qi '^X-Frame-Options: SAMEORIGIN' <<<"$headers"
          grep -qi '^Referrer-Policy: strict-origin-when-cross-origin' <<<"$headers"

      - name: Verify reseller schema
        run: |
          DB_NAME="$(sed -n 's/^DB_NAME=//p' .env)"
          DB_USER="$(sed -n 's/^DB_USER=//p' .env)"
          DB_PASSWORD="$(sed -n 's/^DB_PASSWORD=//p' .env)"
          db() { docker compose exec -T database mariadb -N -u"$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" "$@"; }
          table_count="$(db -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='$DB_NAME' AND table_name IN ('tbl_resellers','tbl_reseller_packages','tbl_reseller_earnings','tbl_reseller_settlements','tbl_reseller_activity_logs')")"
          test "$table_count" -eq 5
          column_count="$(db -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='$DB_NAME' AND table_name='tbl_customers' AND column_name IN ('reseller_id','approval_status')")"
          test "$column_count" -eq 2
          trigger_count="$(db -e "SELECT COUNT(*) FROM information_schema.triggers WHERE trigger_schema='$DB_NAME' AND trigger_name IN ('trg_mobile_customer_revoke','trg_mobile_staff_revoke','trg_mobile_reseller_revoke')")"
          test "$trigger_count" -eq 3
          migration_count="$(db -e "SELECT COUNT(*) FROM tbl_schema_migrations")"
          test "$migration_count" -eq 8

      - name: Verify PHP integration contracts
        run: |
          docker compose exec -T panel php tests/mobile/mobile_app_update_test.php
          docker compose exec -T panel php tests/mikrotik/provisioner_test.php

      - name: Verify RADIUS authentication and accounting
        run: |
          DB_NAME="$(sed -n 's/^DB_NAME=//p' .env)"
          DB_USER="$(sed -n 's/^DB_USER=//p' .env)"
          DB_PASSWORD="$(sed -n 's/^DB_PASSWORD=//p' .env)"
          RADIUS_SHARED_SECRET="$(sed -n 's/^RADIUS_SHARED_SECRET=//p' .env)"
          docker compose exec -T database mariadb -u"$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" -e "DELETE FROM radcheck WHERE username='ci-radius'; INSERT INTO radcheck (username,attribute,op,value) VALUES ('ci-radius','Cleartext-Password',':=','ci-pass');"
          auth_status=0
          auth_output="$(docker compose exec -T radius radtest ci-radius ci-pass 127.0.0.1 0 "$RADIUS_SHARED_SECRET" 2>&1)" || auth_status=$?
          printf '%s\n' "$auth_output"
          if [ "$auth_status" -ne 0 ] || ! grep -q "Access-Accept" <<<"$auth_output"; then
            docker compose ps radius
            docker compose logs --tail=200 radius
            exit 1
          fi
          printf '%s\n' 'User-Name = "ci-radius"' 'Acct-Status-Type = Start' 'Acct-Session-Id = "ci-session-1"' 'NAS-IP-Address = 127.0.0.1' 'NAS-Port = 1' 'Service-Type = Framed-User' 'Framed-Protocol = PPP' 'Framed-IP-Address = 10.10.10.200' | docker compose exec -T radius radclient -x 127.0.0.1:1813 acct "$RADIUS_SHARED_SECRET"
          acct_count="$(docker compose exec -T database mariadb -N -u"$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" -e "SELECT COUNT(*) FROM radacct WHERE username='ci-radius' AND acctsessionid='ci-session-1'")"
          test "$acct_count" -ge 1

      - name: Verify migrations are repeatable
        run: |
          DB_NAME="$(sed -n 's/^DB_NAME=//p' .env)"
          DB_USER="$(sed -n 's/^DB_USER=//p' .env)"
          DB_PASSWORD="$(sed -n 's/^DB_PASSWORD=//p' .env)"
          docker compose restart panel
          for attempt in $(seq 1 40); do
            panel_id="$(docker compose ps -q panel)"
            state="$(docker inspect --format='{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}' "$panel_id")"
            if [ "$state" = "running healthy" ]; then
              trigger_count="$(docker compose exec -T database mariadb -N -u"$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" -e "SELECT COUNT(*) FROM information_schema.triggers WHERE trigger_schema='$DB_NAME' AND trigger_name IN ('trg_mobile_customer_revoke','trg_mobile_staff_revoke','trg_mobile_reseller_revoke')")"
              test "$trigger_count" -eq 3
              exit 0
            fi
            sleep 3
          done
          docker compose ps --all
          docker compose logs panel --tail=200
          exit 1

      - name: Verify full-state backup and restore
        run: |
          DB_NAME="$(sed -n 's/^DB_NAME=//p' .env)"
          DB_USER="$(sed -n 's/^DB_USER=//p' .env)"
          DB_PASSWORD="$(sed -n 's/^DB_PASSWORD=//p' .env)"
          docker compose exec -T panel sh -lc "printf 'panel-before' > /var/www/html/system/uploads/ci-backup-marker"
          docker compose exec -T whatsapp sh -lc "printf 'wa-before' > /data/ci-backup-marker"
          docker compose stop backup
          archive="$(docker compose run --rm --no-deps backup once | tail -n 1 | tr -d '\r')"
          test -n "$archive"
          echo "Backup archive: $archive"
          docker compose run --rm --no-deps --entrypoint sh backup -lc 'test -s "$1" && tar -tzf "$1" >/dev/null' sh "$archive"
          docker compose exec -T database mariadb -u"$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" -e "UPDATE tbl_appconfig SET value='MUTATED' WHERE setting='CompanyName';"
          docker compose exec -T panel sh -lc "printf 'panel-mutated' > /var/www/html/system/uploads/ci-backup-marker"
          docker compose exec -T whatsapp sh -lc "printf 'wa-mutated' > /data/ci-backup-marker"
          docker compose stop gateway radius whatsapp panel cron backup
          docker compose up -d database
          docker compose run --rm --no-deps backup restore "$archive"
          rm -f .env.restored
          docker compose up -d
          healthy=0
          for attempt in $(seq 1 60); do
            expected="$(docker compose config --services | wc -l)"
            running="$(docker compose ps --services --status running | wc -l)"
            if [ "$running" -eq "$expected" ] && docker compose exec -T panel curl -fsS http://127.0.0.1/ >/dev/null 2>&1 && docker compose exec -T whatsapp node -e "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" && docker compose exec -T radius freeradius -XC >/dev/null 2>&1; then
              healthy=1
              break
            fi
            sleep 5
          done
          if [ "$healthy" -ne 1 ]; then
            docker compose ps --all
            docker compose logs --tail=200
            exit 1
          fi
          company="$(docker compose exec -T database mariadb -N -u"$DB_USER" -p"$DB_PASSWORD" "$DB_NAME" -e "SELECT value FROM tbl_appconfig WHERE setting='CompanyName'")"
          test "$company" = "JM Broadband CI"
          test "$(docker compose exec -T panel cat /var/www/html/system/uploads/ci-backup-marker | tr -d '\r')" = "panel-before"
          test "$(docker compose exec -T whatsapp cat /data/ci-backup-marker | tr -d '\r')" = "wa-before"

      - name: Verify updater failed-update rollback
        run: |
          git config user.name "JM Panel CI"
          git config user.email "ci@localhost"
          printf 'rollback-proof\n' > .ci-update-rollback-marker
          git add -f .ci-update-rollback-marker
          git commit -m "CI rollback source marker"
          previous_commit="$(git rev-parse HEAD)"
          set +e
          _PANEL_TEST_ALLOW_NON_ROOT=1 \
          _PANEL_TEST_FORCE_UPDATE_FAILURE=1 \
          PANEL_DIR="$PWD" \
          PANEL_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
          PANEL_ROLLBACK_HEALTH_ATTEMPTS=20 \
          bash installer/update.sh > /tmp/update-rollback.log 2>&1
          update_status=$?
          set -e
          cat /tmp/update-rollback.log
          test "$update_status" -ne 0
          test "$(git rev-parse HEAD)" = "$previous_commit"
          test -f .ci-update-rollback-marker
          grep -q "Rollback completed successfully" /tmp/update-rollback.log
          ls backup-before-update-*.sql.gz >/dev/null

      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans

  installer-smoke:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Run one-command installer on clean path
        run: |
          sudo env \
            PANEL_SKIP_SYSTEM_SETUP=1 \
            PANEL_DIR="$RUNNER_TEMP/jm-panel-fresh" \
            PANEL_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
            PANEL_HOST=127.0.0.1 \
            PANEL_SITE_ADDRESS=:80 \
            PANEL_COMPANY_NAME="JM Broadband Installer CI" \
            PANEL_ADMIN_USER=installer-ci \
            PANEL_ADMIN_PASSWORD=installer-ci-password \
            RADIUS_CLIENT_NETWORK=0.0.0.0/0 \
            bash installer/install.sh

      - name: Verify installer output
        run: |
          app="$RUNNER_TEMP/jm-panel-fresh"
          sudo test -f "$app/.env"
          sudo test -f "$app/install-credentials.txt"
          sudo grep -F "Panel URL: http://127.0.0.1" "$app/install-credentials.txt"
          sudo grep -F "Admin username: installer-ci" "$app/install-credentials.txt"
          test "$(sudo stat -c '%a' "$app/.env")" = "600"
          test "$(sudo stat -c '%a' "$app/install-credentials.txt")" = "600"
          expected="$(sudo docker compose --project-directory "$app" config --services | wc -l)"
          running="$(sudo docker compose --project-directory "$app" ps --services --status running | wc -l)"
          test "$running" -eq "$expected"

      - name: Stop installer stack
        if: always()
        run: |
          app="$RUNNER_TEMP/jm-panel-fresh"
          if [ -f "$app/docker-compose.yml" ]; then
            sudo docker compose --project-directory "$app" down -v --remove-orphans
          fi
