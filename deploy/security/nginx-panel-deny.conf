# Include inside existing Nginx server {} for the phpNuxBill virtual host.
# Repository template only: committing this does NOT alter production Nginx.
# Place rules above generic PHP/static-file regex locations.
location ^~ /panel/install/ {
    return 404;
}

location ~* ^/panel/.*\.(?:log|sql|sqlite|db|bak|backup|old|env|ini|pem|key|p12|jks|keystore|zip|tar|gz)(?:\.[^/]*)?$ {
    return 404;
}

location = /panel/radius_backup.php {
    return 404;
}

